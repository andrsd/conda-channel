{% set version = "0.3.1" %}
{% set build = 0 %}

package:
  name: exodusii-utils
  version: {{ version }}

source:
  url: https://github.com/andrsd/exodusII-utils/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e5eda90c8191b7f11d919cf9e80b8b35b967b2b8ee295db32f9231a986f94328

build:
  number: {{ build }}
  skip: true # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake
    - make
  host:
    - fmt 11.*
    - exodusiicpp 3.*
  run:
    - fmt 11.*
    - exodusiicpp 3.*

test:
  commands:
    - $PREFIX/bin/exo-info --help
    - $PREFIX/bin/exo-join --help

about:
  home: data['url']
  license: MIT
  summary: Set of utils for exodusII files
  doc_url: https://andrsd.github.io/exodusII-utils

extra:
  recipe-maintainers:
    - andrsd

{% set version = "0.4.0" %}
{% set build = 0 %}

package:
  name: exodusii-utils
  version: {{ version }}

source:
  url: https://github.com/andrsd/exodusII-utils/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 80abfd05ed61dc3ffe398423e3923a198f75f3d3d0a8a7338a198d68a07ae6e8

build:
  number: {{ build }}
  skip: true # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake
    - make
  host:
    - fmt 11.*
    - exodusiicpp 3.2.*
  run:
    - fmt 11.*
    - exodusiicpp 3.2.*

test:
  commands:
    - $PREFIX/bin/exo-info --help
    - $PREFIX/bin/exo-join --help

about:
  home: data['url']
  license: MIT
  summary: Set of utils for exodusII files
  doc_url: https://andrsd.github.io/exodusII-utils

extra:
  recipe-maintainers:
    - andrsd

{% set version = "3.0.0" %}
{% set build = 1 %}

package:
  name: krado
  version: {{ version }}

source:
  url: https://github.com/andrsd/krado/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 37d946a2f0a35d3a1bc8103faf3adf626605589ed18ccc8741cf68d1c1df98ea

build:
  number: {{ build }}

requirements:
  build:
    - {{ cdt('mesa-libGL-devel') }}  # [linux and x86_64]
    - {{ compiler('cxx') }}
    - cmake
    - make
  host:
    - python {{ python }}
    - setuptools
    - exodusiicpp =3.2.*
    - occt =7.9.*
    - eigen =3.4.*
    - libboost-devel =1.88.*
    - fmt 11.*
    - spdlog 1.16.*
    - pybind11
  run:
    - python
    - exodusiicpp =3.2.*
    - occt =7.9.*
    - fmt 11.*
    - spdlog 1.16.*

about:
  home: https://github.com/andrsd/krado
  license: MIT
  license_file: LICENSE
  summary: Mesh manipulation package
  doc_url: https://andrsd.github.io/krado

extra:
  recipe-maintainers:
    - andrsd
